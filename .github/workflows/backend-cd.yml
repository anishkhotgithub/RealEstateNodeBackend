name: Node Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Run Linter
        run: npm run lint

      - name: 🏗 Build Project
        run: npm run build

      - name: 🧪 Run Backend Tests
        run: npm test

      - name: 🚀 Verify Server Starts
        run: |
          node dist/app.js &
          sleep 5
